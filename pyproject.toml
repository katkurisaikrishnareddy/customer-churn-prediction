[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Production-grade customer churn prediction system"
readme = "README.md"
requires-python = ">=3.10"

[tool.pyrefly]
python-interpreter-path = "C:/Users/katku/AppData/Local/Programs/Python/Python311/python.exe"
search-path = [
    ".",
    "src",
    "C:/Users/katku/AppData/Local/Programs/Python/Python311/Lib/site-packages",
]
project-includes = [
    "src/**",
    "tests/**",
    "app.py",
    "run_pipeline.py",
]

[tool.pyright]
include = [".", "src", "tests"]
extraPaths = [
    ".",
    "src",
    "C:/Users/katku/AppData/Local/Programs/Python/Python311/Lib/site-packages",
]
pythonPath = "C:/Users/katku/AppData/Local/Programs/Python/Python311/python.exe"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
